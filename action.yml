name: Hackaiz Import Gate
description: Hackaiz check of Skills, MCP configs, packages, workflows and Dockerfiles (rules + expert AI review). Fails on Danger, uploads SARIF.
author: HACKTUALIZ Inc.
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: File or folder to check
    default: .
  api-key:
    description: Hackaiz personal API key (store it as a repository secret). Each check uses credits.
    required: true
  language:
    description: en or fr
    default: en
  fail-on-incomplete:
    description: Fail the job when no verdict is returned (recommended)
    default: 'true'
outputs:
  sarif:
    description: Path of the SARIF file
    value: ${{ steps.check.outputs.sarif }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        HACKAIZ_API_KEY: ${{ inputs.api-key }}
        HK_PATH: ${{ inputs.path }}
        HK_LANG: ${{ inputs.language }}
        HK_STRICT: ${{ inputs.fail-on-incomplete }}
      run: |
        set +e
        out="$RUNNER_TEMP/hackaiz.sarif"
        node "$GITHUB_ACTION_PATH/cli/bin/hackaiz.mjs" check "$HK_PATH" --sarif --lang "$HK_LANG" > "$out"
        code=$?
        echo "sarif=$out" >> "$GITHUB_OUTPUT"
        echo "### Hackaiz Import Gate" >> "$GITHUB_STEP_SUMMARY"
        # List every finding (rule, file, line, message) so a Danger verdict always shows its cause.
        node -e '
          const fs=require("fs");let r=[];
          try{const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));r=(s.runs||[]).flatMap(x=>x.results||[]);}catch{}
          const sum=process.env.GITHUB_STEP_SUMMARY;
          if(r.length){fs.appendFileSync(sum,"\n| Rule | File | Line | Detail |\n|---|---|---|---|\n");}
          for(const x of r){const l=(x.locations||[])[0]?.physicalLocation||{};const f=l.artifactLocation?.uri||"";const n=l.region?.startLine||"";
            const m=(x.message?.text||"").replace(/[|\n]/g," ");
            fs.appendFileSync(sum,`| ${x.ruleId||""} | ${f} | ${n} | ${m} |\n`);
            console.log(`::${x.level==="error"?"error":x.level==="note"?"notice":"warning"} file=${f},line=${n||1}::${x.ruleId||"Hackaiz"} ${m}`);}
        ' "$out"
        if [ "$code" = 2 ]; then echo "Verdict: **Danger**. Do not install." >> "$GITHUB_STEP_SUMMARY"; echo "::error::Hackaiz verdict: Danger"; exit 1; fi
        if [ "$code" = 3 ]; then
          echo "Verdict: **Incomplete**. Not everything could be checked: do not treat it as safe." >> "$GITHUB_STEP_SUMMARY"; echo "::warning::Hackaiz verdict: Incomplete"
          if [ "$HK_STRICT" = true ]; then exit 1; fi; exit 0
        fi
        if [ "$code" != 0 ]; then
          echo "No verdict (error, missing key or credits). Not verified." >> "$GITHUB_STEP_SUMMARY"
          if [ "$HK_STRICT" = true ]; then exit 1; fi; exit 0
        fi
        echo "No known risk found by rules and expert review. Quality notes (if any) are listed above. This is not a guarantee." >> "$GITHUB_STEP_SUMMARY"
